[package]
name = "ipfs_indexer"
version = "0.4.6"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cid = "0.11.1"
log = "0.4.21"
simple_logger = "5.0.0"
actix-web = "4"
reqwest = { version = "0.13.0", features = ["gzip", "blocking"] }
scraper = "0.27.0"
serde_json = "1"
threadpool = "1.8"
dashmap = "6.0.0"
sha2 = "0.11.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
libc = "0.2"
