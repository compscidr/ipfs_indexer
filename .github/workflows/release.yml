name: Release image
# Push a vX.Y.Z tag (matching Cargo.toml's version) to publish
# ghcr.io/compscidr/ipfs_indexer:vX.Y.Z. The iac ansible role pins that tag, so the
# server pulls a built image instead of compiling on the host.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # the tag names the image and Cargo.toml's version shows in /version; refuse a mismatch
      - name: Check the tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$tag" != "v$version" ]]; then
            echo "::error::tag $tag doesn't match Cargo.toml version $version"; exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          # links the package to this repo (and its visibility) on ghcr
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
